name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  app:
    name: App checks
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_URL: https://example.org
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_example_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/configure-organization.ts --check
      - run: pnpm run check:release
      - run: pnpm run test:ci
      - run: pnpm run lint
      - run: pnpm run type-check
      - run: pnpm run build

  database:
    name: Fresh database checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start isolated local Supabase project
        run: |
          if ! pnpm exec supabase start > "$RUNNER_TEMP/supabase-start.log" 2>&1; then
            python3 - "$RUNNER_TEMP/supabase-start.log" <<'PY'
          import re
          import sys

          lines = open(sys.argv[1], encoding='utf-8', errors='replace').readlines()
          errors = [line for line in lines if re.search(r'error|fail|denied|timeout|timed out|unavailable|rate limit|pull|unable|cannot', line, re.I)]
          print('Local Supabase start failed; diagnostic lines:')
          for line in (errors or lines)[-30:]:
              safe = re.sub(r'(?i)(?:sb_(?:secret|publishable)_[A-Za-z0-9_-]+|eyJ[A-Za-z0-9_.-]{20,}|(?:postgres(?:ql)?|https?)://\S+|Bearer\s+\S+)', '[redacted]', line)
              print(safe[:500], end='')
          PY
            exit 1
          fi
      - name: Verify project identity and reset
        run: |
          test "$(docker ps --filter name=^/supabase_db_lostopedia-template$ --format '{{.Names}}')" = supabase_db_lostopedia-template
          pnpm exec supabase db reset --local > "$RUNNER_TEMP/supabase-reset.log" 2>&1 || { echo 'Local database reset failed'; exit 1; }
      - name: Verify repeatable organization setup and SQL policies
        run: |
          docker exec -i supabase_db_lostopedia-template psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/seed.sql > "$RUNNER_TEMP/seed-replay.log"
          pnpm exec supabase test db --local
          pnpm exec supabase db lint --local --schema public --fail-on error

  secrets:
    name: Secret and release scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install checksum-pinned Gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan current committed tree and full available history
        run: |
          mkdir -p "$RUNNER_TEMP/release-tree"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/release-tree"
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/release-tree" --redact --no-banner
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner
