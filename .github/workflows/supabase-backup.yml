name: Weekly Supabase backup

on:
  schedule:
    # Saturday 19:17 UTC. Adjust to your deployment recovery requirements.
    - cron: '17 19 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-backup
  cancel-in-progress: false

jobs:
  backup:
    # Enable only after the operator completes the setup and Supabase restore drill.
    # Manual runs obey the same gate and cannot select another source branch.
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      vars.SUPABASE_BACKUP_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install verified backup tooling
        run: bash scripts/backup/install-tools.sh

      - name: Export, encrypt, verify upload, and retain eight backups
        env:
          SUPABASE_BACKUP_DB_URL: ${{ secrets.SUPABASE_BACKUP_DB_URL }}
          SUPABASE_BACKUP_CA_CERT: ${{ secrets.SUPABASE_BACKUP_CA_CERT }}
          # Guard against accidentally exporting another connected project.
          SUPABASE_BACKUP_PROJECT_REF: ${{ vars.SUPABASE_BACKUP_PROJECT_REF }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: bash scripts/backup/backup.sh

      - name: Failure guidance
        if: failure()
        run: |
          printf '%s\n' 'Backup failed. Review docs/operations/supabase-backup.md; verify the last completed R2 backup. No new recovery point is claimed.' >> "$GITHUB_STEP_SUMMARY"
